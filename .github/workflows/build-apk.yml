name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build web app
        run: bun run build

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Capacitor CLI
        run: bun add @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialize Capacitor & Add Android Platform
        run: |
          bunx cap init SkiFree com.skifree.game --web-dir dist || true
          bunx cap add android || true
          bunx cap copy android

      - name: Build APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkiFree-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
